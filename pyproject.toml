[project]
name = "readmission"
version = "0.1.0"
description = "Hospital readmission lakehouse for the fictional client Contoso Health"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "databricks-sdk>=0.155.0",
    "httpx>=0.28.1",
    "jsonschema>=4.23",
]

# Entry points for the readmission_pipeline job's python_wheel_task tasks.
[project.scripts]
readmission-fetch = "readmission.ingest.fetch:main"
readmission-bronze = "readmission.bronze.load:main"
readmission-contoso = "readmission.bronze.contoso:main"
readmission-silver = "readmission.silver.build:main"
readmission-gold = "readmission.gold.build:main"
readmission-train = "readmission.ml.train:main"
readmission-score = "readmission.ml.score:main"
readmission-llm-extract = "readmission.llm.build:main"

[dependency-groups]
# PySpark is provided by the Databricks runtime, so it stays dev-only.
# Delta Lake 3.3.x is the release line built for Spark 3.5.x.
dev = [
    "pytest",
    "ruff",
    "pyspark==3.5.9",
    "delta-spark==3.3.3",
    "psycopg[binary]>=3.3.6",
]
# The penalty model's libraries, pinned to what the job's readmission_ml environment runs, so a
# model trained and pickled on serverless loads the same way locally. scikit-learn, pandas, numpy
# and matplotlib are the versions serverless environment 2 ships; LightGBM and mlflow-skinny are
# installed on top (see resources/readmission_pipeline.yml). Locally LightGBM needs libomp
# (`brew install libomp` on a Mac); the tests never fit it.
ml = [
    "lightgbm==4.7.0",
    "matplotlib==3.7.2",
    "mlflow-skinny==2.22.0",
    "numpy==1.23.5",
    "pandas==1.5.3",
    "scikit-learn==1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readmission"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real CMS API, run with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
docstring-code-format = false
exclude = ["*.md"]

[tool.uv]
default-groups = ["dev", "ml"]
