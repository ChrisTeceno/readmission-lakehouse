[project]
name = "readmission"
version = "0.1.0"
description = "Hospital readmission lakehouse for the fictional client Contoso Health"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
# PySpark is provided by the Databricks runtime, so it stays dev-only.
# Delta Lake 3.3.x is the release line built for Spark 3.5.x.
dev = [
    "pytest",
    "ruff",
    "pyspark==3.5.9",
    "delta-spark==3.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readmission"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real CMS API, run with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
docstring-code-format = false
exclude = ["*.md"]
