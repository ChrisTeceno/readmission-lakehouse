# engagement/wireframe.md) and example SQL live in src/genie/readmission.geniespace.json; what
# Genie answered and which instructions fixed its mistakes is in docs/genie.md.
resources:
  genie_spaces:
    readmission_genie:
      title: Contoso Health readmissions
      description: >-
        Ask about Contoso Health's HRRP penalty position, peer trends, FY2028 predictions,
