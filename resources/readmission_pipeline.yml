# The pipeline job: fetch every source into the landing volume, then load landing into Bronze.
# The contoso task reads Contoso's Lakebase database directly, so it runs beside fetch.
# The silver task runs after bronze and contoso: it builds the CMS and MTSamples Silver tables
# and quarantines the Contoso rows the contoso task left out of Silver. The gold task builds the
# Gold tables from Silver.
# All tasks run the project wheel (the `readmission` artifact in databricks.yml) on serverless,
# and each logs its run to ops_run_log and ops_dq_metrics (readmission.ops).
# Run it with `databricks bundle run readmission_pipeline -t dev`; add
# `--params fail_task=<task>` to make that task fail, which tests the failure email.
resources:
  jobs:
    readmission_pipeline:
      name: readmission_pipeline
      max_concurrent_runs: 1
      # Daily at 06:00 UTC. The dev target's trigger_pause_status preset leaves it paused.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: fail_task
          default: ""
      environments:
        - environment_key: readmission
          spec:
            # Environment version 2 runs Python 3.11, which the package requires.
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: fetch
          environment_key: readmission
          # CMS datastore pages take 40 to 55 seconds each and the PDC archive zips are large.
          timeout_seconds: 3600
          # A download that still fails after the HTTP client's own exponential backoff (5
          # attempts, 1 to 16 seconds apart) reruns the whole task, up to twice. Jobs retry at a
          # fixed interval, so the task-level wait is a flat two minutes.
          max_retries: 2
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          python_wheel_task:
            package_name: readmission
            entry_point: readmission-fetch
            parameters:
              - cms_hrrp
              - cms_hospital_info
              - cms_unplanned_visits
              - hrrp_history_pdc
              - hrrp_history_ipps
              - acs_county
              - --work-dir
              - /tmp/readmission-fetch
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --job-run-id={{job.run_id}}
              - --fail-task={{job.parameters.fail_task}}
        - task_key: bronze
          depends_on:
            - task_key: fetch
          environment_key: readmission
          timeout_seconds: 1800
          python_wheel_task:
            package_name: readmission
            entry_point: readmission-bronze
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --job-run-id={{job.run_id}}
              - --fail-task={{job.parameters.fail_task}}
        - task_key: contoso
          environment_key: readmission
          timeout_seconds: 1800
          python_wheel_task:
            package_name: readmission
            entry_point: readmission-contoso
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --job-run-id={{job.run_id}}
              - --fail-task={{job.parameters.fail_task}}
        - task_key: silver
          depends_on:
            - task_key: bronze
            - task_key: contoso
          environment_key: readmission
          timeout_seconds: 1800
          python_wheel_task:
            package_name: readmission
            entry_point: readmission-silver
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --job-run-id={{job.run_id}}
              - --fail-task={{job.parameters.fail_task}}
        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: readmission
          timeout_seconds: 1800
          python_wheel_task:
            package_name: readmission
            entry_point: readmission-gold
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --job-run-id={{job.run_id}}
              - --fail-task={{job.parameters.fail_task}}
