# The pipeline job: fetch every source into the landing volume, then load landing into Bronze.
# The contoso task reads Contoso's Lakebase database directly, so it runs beside fetch.
# The silver task runs after bronze and contoso: it builds the CMS and MTSamples Silver tables
# and quarantines the Contoso rows the contoso task left out of Silver. The gold task builds the
# Gold tables from Silver. The train task fits the penalty model on gold_features, logs the
# candidates to MLflow and moves the champion alias only if the metric gate passes; the score
# task then writes gold_penalty_predictions with the champion. Both stay in this job rather than
# a separate one so the predictions always come from the features this run built, and a failed
# gate skips scoring instead of scoring with a model that did not pass.
# The llm_extract task, beside gold, asks a Foundation Model endpoint for the risk factors in
# the next batch of MTSamples notes (readmission.llm.build).
# All tasks run the project wheel (the `readmission` artifact in databricks.yml) on serverless,
# and each logs its run to ops_run_log and ops_dq_metrics (readmission.ops).
# Run it with `databricks bundle run readmission_pipeline -t dev`; add
# `--params fail_task=<task>` to make that task fail, which tests the failure email.
resources:
  jobs:
    readmission_pipeline:
      name: readmission_pipeline
      max_concurrent_runs: 1
      # Daily at 06:00 UTC. The dev target's trigger_pause_status preset leaves it paused.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: fail_task
          default: ""
      environments:
        - environment_key: readmission
          spec:
            # Environment version 2 runs Python 3.11, which the package requires.
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
        # train and score also need LightGBM, and an MLflow newer than the 2.11.4 environment 2
        # ships: on Free Edition 2.11 uploads a model version's files straight to S3, which the
        # bucket policy denies, and registration in Unity Catalog fails (2.20 and later upload
        # through the workspace). Environment 4 ships 2.22.0 but runs Python 3.12, which the
        # package excludes. scikit-learn, pandas, numpy and matplotlib are the versions
        # environment 2 ships; all match the `ml` dependency group in pyproject.toml.
        - environment_key: readmission_ml
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
              - lightgbm==4.7.0
              - scikit-learn==1.3.0
              - mlflow-skinny==2.22.0
      tasks:
        - task_key: fetch
          environment_key: readmission
          # CMS datastore pages take 40 to 55 seconds each and the PDC archive zips are large.
          timeout_seconds: 3600
          # A download that still fails after the HTTP client's own exponential backoff (5
          # attempts, 1 to 16 seconds apart) reruns the whole task, up to twice. Jobs retry at a
          # fixed interval, so the task-level wait is a flat two minutes.
          max_retries: 2
          min_retry_interval_millis: 120000
          retry_on_timeout: false
          python_wheel_task:
            package_name: readmission
            entry_point: readmission-fetch
            parameters:
              - cms_hrrp
              - cms_hospital_info
              - cms_unplanned_visits
              - hrrp_history_pdc
              - hrrp_history_ipps
              - acs_county
              - --work-dir
              - /tmp/readmission-fetch
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --job-run-id={{job.run_id}}
              - --fail-task={{job.parameters.fail_task}}
        - task_key: bronze
          depends_on:
            - task_key: fetch
          environment_key: readmission
          timeout_seconds: 1800
          python_wheel_task:
            package_name: readmission
            entry_point: readmission-bronze
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --job-run-id={{job.run_id}}
              - --fail-task={{job.parameters.fail_task}}
        - task_key: contoso
          environment_key: readmission
          timeout_seconds: 1800
          python_wheel_task:
            package_name: readmission
            entry_point: readmission-contoso
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --job-run-id={{job.run_id}}
              - --fail-task={{job.parameters.fail_task}}
        - task_key: silver
          depends_on:
            - task_key: bronze
            - task_key: contoso
          environment_key: readmission
          timeout_seconds: 1800
          python_wheel_task:
            package_name: readmission
            entry_point: readmission-silver
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --job-run-id={{job.run_id}}
              - --fail-task={{job.parameters.fail_task}}
        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: readmission
          timeout_seconds: 1800
          python_wheel_task:
            package_name: readmission
            entry_point: readmission-gold
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --job-run-id={{job.run_id}}
              - --fail-task={{job.parameters.fail_task}}
        - task_key: train
          depends_on:
            - task_key: gold
          environment_key: readmission_ml
          timeout_seconds: 1800
          python_wheel_task:
            package_name: readmission
            entry_point: readmission-train
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --experiment
              - /Shared/readmission-penalty
              - --job-run-id={{job.run_id}}
              - --fail-task={{job.parameters.fail_task}}
        - task_key: score
          depends_on:
            - task_key: train
          environment_key: readmission_ml
          timeout_seconds: 1800
          python_wheel_task:
            package_name: readmission
            entry_point: readmission-score
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --job-run-id={{job.run_id}}
              - --fail-task={{job.parameters.fail_task}}
        - task_key: llm_extract
          depends_on:
            - task_key: silver
          environment_key: readmission
          # A 100-note batch is two ai_query passes (first answers, then retries).
          timeout_seconds: 1800
          python_wheel_task:
            package_name: readmission
            entry_point: readmission-llm-extract
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --job-run-id={{job.run_id}}
              - --fail-task={{job.parameters.fail_task}}
